[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "featherweight-telemetry"
version = "0.1.0"
description = "Python library for reading, parsing, recording, and replaying Featherweight Altimeters telemetry"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Featherweight Telemetry Contributors" }]
keywords = ["rocketry", "telemetry", "featherweight", "gps", "serial"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Communications",
]
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
featherweight-telemetry = "featherweight_telemetry.cli:main"

[project.urls]
Homepage = "https://github.com/rubenfixit/python-featherweight-tlm"
Repository = "https://github.com/rubenfixit/python-featherweight-tlm"
Issues = "https://github.com/rubenfixit/python-featherweight-tlm/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
