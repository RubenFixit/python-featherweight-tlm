name: Publish to PyPI

# Triggered manually or when a version tag is pushed (e.g. v0.1.0).
# Uses PyPI Trusted Publishing (OIDC) — no API token stored in secrets.
#
# Setup required (one-time, on PyPI):
#   1. Create the project on PyPI (or use the existing one).
#   2. Go to Project → Publishing → Add a publisher.
#   3. Set: owner=<your-org>, repo=python-featherweight-tlm,
#           workflow=publish.yml, environment=pypi
#
# Then create the "pypi" environment in GitHub:
#   Settings → Environments → New environment → "pypi"
#   Add a protection rule: require review, or restrict to tag pushes.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'publish' to confirm manual release"
        required: true

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for OIDC trusted publishing
      contents: read

    steps:
      - name: Validate manual trigger
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "publish" ]; then
            echo "Confirmation string did not match. Aborting."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No username/password needed — uses OIDC trusted publishing.
        # To publish to TestPyPI first, add:
        #   with:
        #     repository-url: https://test.pypi.org/legacy/
